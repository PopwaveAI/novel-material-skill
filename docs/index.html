<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网文写作素材库 · 16 本 · 316 万字</title>
<style>
:root{--bg:#fbfaf7;--fg:#1b1916;--mut:#8b8479;--line:#e7e2d9;--acc:#b4442e;--panel:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:880px;margin:0 auto;padding:0 22px}
header{padding:56px 0 28px;border-bottom:1px solid var(--line)}
h1{font-size:30px;line-height:1.25;margin:0 0 10px;letter-spacing:-.02em}
.meta{color:var(--mut);font-size:14px}
.meta b{color:var(--fg);font-weight:600}
#q{width:100%;margin:26px 0 10px;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);outline:none}
#q:focus{border-color:#c9c1b4;box-shadow:0 0 0 3px #efe9df}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mut);cursor:pointer;background:var(--panel)}
.chip.on{color:#fff;background:var(--fg);border-color:var(--fg)}
#count{color:var(--mut);font-size:13px;margin-bottom:8px}
.row{display:flex;gap:12px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f5f1ea}
.row .b{flex:0 0 132px;font-size:12.5px;color:var(--mut)}
.row .t{flex:1;font-size:15px}
.row .c{flex:0 0 66px;text-align:right;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
#open{position:fixed;inset:0;background:rgba(20,18,15,.42);display:none;padding:28px 16px;overflow:auto}
#open.on{display:block}
.sheet{max-width:820px;margin:0 auto;background:var(--panel);border-radius:14px;padding:30px 34px 46px;box-shadow:0 18px 60px rgba(0,0,0,.18)}
.sheet h1{font-size:24px}
.sheet h2{font-size:19px;margin:26px 0 10px}
.sheet h3{font-size:15.5px;font-weight:600;margin:24px 0 8px;color:#3a352d}
.sheet p{margin:12px 0}
.sheet blockquote{margin:14px 0;padding:8px 14px;border-left:3px solid var(--line);color:var(--mut);font-size:13.5px}
.sheet ul{padding-left:22px}
.sheet li{margin:5px 0}
table{border-collapse:collapse;width:100%;margin:16px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f6f2eb;font-weight:600}
.close{float:right;border:0;background:none;font-size:22px;color:var(--mut);cursor:pointer;line-height:1}
footer{padding:40px 0 70px;color:var(--mut);font-size:13px}
@media(max-width:600px){.row .b{display:none}.sheet{padding:22px 18px 34px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>网文写作素材库</h1>
  <div class="meta"><b>16 本</b> · <b>316 万字</b> · <b>2,958 节</b> · 全部开源 · 素材 CC BY 4.0</div>
  <input id="q" placeholder="搜：冷面克制 / 先婚后爱 / 开篇钩子 / 雷区 / 五感">
  <div class="chips" id="chips"></div>
  <div id="count"></div>
</header>
<div id="list"></div>
<footer>
  每一节都是原文切片，不是摘要。<a href="https://github.com/PopwaveAI/novel-material-skill">GitHub</a> · 引用格式：素材来源：novel-material-skill ·《书名》节号
</footer>
</div>
<div id="open"><div class="sheet" id="sheet"></div></div>
<script>
var REPO = "https://github.com/PopwaveAI/novel-material-skill/blob/main/";
var DATA = null, CAT = "", Q = "", BNAME = {};
document.getElementById("q").addEventListener("input", function (e) {
  Q = e.target.value.trim(); draw(); });
function esc(s) { return s.replace(/[&<>]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
fetch("index.json").then(function (r) { return r.json(); }).then(function (d) {
  DATA = d;
  d.books.forEach(function (b) { BNAME[b.id] = b.name; });
  var cats = ["通识","人设","关系","题材"];
  document.getElementById("chips").innerHTML = ["全部"].concat(cats).map(function (c) {
    return '<span class="chip' + ((c === "全部" && !CAT) ? " on" : (c === CAT ? " on" : "")) +
      '" data-c="' + (c === "全部" ? "" : c) + '">' + c + "</span>";
  }).join("");
  [].forEach.call(document.querySelectorAll(".chip"), function (el) {
    el.onclick = function () { CAT = el.getAttribute("data-c"); draw(); };
  });
  draw();
});
function draw() {
  if (!DATA) return;
  var bookCat = {};
  DATA.books.forEach(function (b) { bookCat[b.id] = b.cat; });
  var items = DATA.items.filter(function (it) {
    if (CAT && bookCat[it[0]] !== CAT) return false;
    if (!Q) return true;
    var hay = (BNAME[it[0]] || "") + it[1] + it[2];
    return Q.split(/\s+/).every(function (w) { return hay.indexOf(w) > -1; });
  });
  document.getElementById("count").textContent = items.length + " 节";
  var show = items.slice(0, 300);
  document.getElementById("list").innerHTML = show.map(function (it, i) {
    return '<div class="row" data-i="' + i + '"><span class="b">' + esc(BNAME[it[0]] || "") +
      '</span><span class="t">' + esc(it[1]) + '</span><span class="c">' + it[3].toLocaleString() + " 字</span></div>";
  }).join("") + (items.length > 300 ? '<div class="count">还有 ' + (items.length - 300) + ' 节，收窄关键词再看</div>' : "");
  [].forEach.call(document.querySelectorAll(".row"), function (el) {
    el.onclick = function () { openItem(show[+el.getAttribute("data-i")]); };
  });
  [].forEach.call(document.querySelectorAll(".chip"), function (el) {
    el.className = "chip" + ((el.getAttribute("data-c") || "") === CAT ? " on" : "");
  });
}
function md(src) {
  var lines = src.split("\n"), out = [], i = 0, buf = [];
  function flush() { if (buf.length) { out.push("<p>" + buf.join("") + "</p>"); buf = []; } }
  while (i < lines.length) {
    var L = lines[i];
    if (/^\s*$/.test(L)) { flush(); i++; continue; }
    if (/^\|/.test(L) && /^\|[\s\-:|]+\|$/.test(lines[i + 1] || "")) {
      flush();
      var rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      var cells = rows.map(function (r) { return r.replace(/^\||\|$/g, "").split("|").map(function (c) { return esc(c.trim()); }); });
      var head = cells[0], body = cells.slice(2);
      out.push("<table><thead><tr>" + head.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" +
        body.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
      continue;
    }
    var m;
    if ((m = L.match(/^#{1,3}\s+(.*)$/))) { flush(); out.push("<h" + m[1].length + ">" + esc(m[1]) + "</h" + m[1].length + ">"); i++; continue; }
    if ((m = L.match(/^>\s?(.*)$/))) { flush(); out.push("<blockquote>" + esc(m[1]) + "</blockquote>"); i++; continue; }
    if (/^-\s+/.test(L)) { flush(); var li = []; while (i < lines.length && /^-\s+/.test(lines[i])) { li.push("<li>" + esc(lines[i].replace(/^-\s+/, "")) + "</li>"); i++; } out.push("<ul>" + li.join("") + "</ul>"); continue; }
    buf.push(esc(L)); i++;
  }
  flush();
  return out.join("");
}
function openItem(it) {
  var url = "../references/" + encodeURIComponent(BNAME[it[0]]) + "/" + encodeURIComponent(it[2]);
  var gh = REPO + "references/" + encodeURIComponent(BNAME[it[0]]) + "/" + encodeURIComponent(it[2]);
  var sheet = document.getElementById("sheet");
  sheet.innerHTML = '<button class="close" onclick="document.getElementById(\'open\').className=\'\'">×</button><p class="meta">加载中…</p>';
  document.getElementById("open").className = "on";
  fetch(url).then(function (r) { return r.text(); }).then(function (t) {
    sheet.innerHTML = '<button class="close" onclick="document.getElementById(\'open\').className=\'\'">×</button>' +
      md(t) + '<p class="meta"><a href="' + gh + '" target="_blank" rel="noopener">在 GitHub 看原文 ↗</a></p>';
    window.scrollTo(0, 0);
  }).catch(function () { sheet.innerHTML = '<p>加载失败，去 <a href="' + gh + '">GitHub</a> 看。</p>'; });
}
document.getElementById("open").addEventListener("click", function (e) {
  if (e.target.id === "open") this.className = ""; });
</script>
</body>
</html>
